<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Order - Jasa Arsitek & Struktur</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <div class="container">
            <div class="logo">Arch<span>Structure</span></div>
            <nav><ul><li><a href="index.html">Kembali ke Beranda</a></li></ul></nav>
        </div>
    </header>

    <section class="form-section">
        <div class="container">
            <h2>Formulir Pengajuan Proyek</h2>
            <p>Isi detail di bawah ini untuk mendapatkan estimasi penawaran harga proporsional.</p>
            
            <form id="orderForm" class="order-form">
                <div class="form-group">
                    <label>Nama Lengkap :</label>
                    <input type="text" id="nama" required placeholder="Masukkan nama Anda">
                </div>
                
                <div class="form-group">
                    <label>Nomor WhatsApp :</label>
                    <input type="tel" id="whatsapp" required placeholder="Contoh: 085692102857">
                </div>

                <div class="form-group">
                    <label>Jenis Layanan :</label>
                    <select id="layanan">
                        <option value="Arsitektur 2D">Desain Arsitektur &amp; Denah 2D (AutoCAD)</option>
                        <option value="Struktur Teknik">Gambar Struktur Teknik (Baja/Beton)</option>
                        <option value="Paket Komplit 3D">Paket Komplit + Visualisasi 3D</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Estimasi Luas Bangunan ($m^2$) :</label>
                    <input type="number" id="luas" required placeholder="Contoh: 100">
                </div>

                <div class="form-group">
                    <label>Catatan Tambahan / Detail Proyek :</label>
                    <textarea id="catatan" rows="4" placeholder="Misal: Gudang struktur baja WF atau Ruko 2 lantai..."></textarea>
                </div>

                <button type="submit" class="submit-btn">Kirim Pengajuan Proyek</button>
            </form>
            
            <div id="responseMessage" class="message hidden"></div>
        </div>
    </section>

    <script>
        document.getElementById('orderForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const orderData = {
                nama: document.getElementById('nama').value,
                whatsapp: document.getElementById('whatsapp').value,
                layanan: document.getElementById('layanan').value,
                luas: document.getElementById('luas').value,
                catatan: document.getElementById('catatan').value
            };

            const responseMessage = document.getElementById('responseMessage');

            try {
                const response = await fetch('/api/order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(orderData)
                });

                const result = await response.json();
                
                if(response.ok) {
                    responseMessage.className = "message success";
                    responseMessage.innerText = `Sukses! ${result.message}. Estimasi Harga: Rp ${result.estimasi.toLocaleString('id-ID')}`;
                    document.getElementById('orderForm').reset();
                } else {
                    responseMessage.className = "message error";
                    responseMessage.innerText = "Gagal mengirim pengajuan.";
                }
            } catch (error) {
                responseMessage.className = "message error";
                responseMessage.innerText = "Terjadi kesalahan jaringan.";
            }
        });
    </script>
</body>
</html>
